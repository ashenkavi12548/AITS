services:
  postgres:
    image: postgres:16-alpine
    container_name: aits-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aits
    volumes:
      - postgres_aits_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aits"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web-based Database Management UI (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aits-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_aits_data:
    driver: local
