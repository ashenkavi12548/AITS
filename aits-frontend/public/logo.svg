<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="aitsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="100%" stop-color="#0b7a5e" />
    </linearGradient>
    <filter id="aitsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10a37f" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Green Bubble with subtle shadow -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#aitsGrad)" filter="url(#aitsGlow)" />
  
  <!-- Tracker Signals and Center Beacon inside the Green Bubble -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Beacon Point -->
    <circle cx="50" cy="50" r="7" fill="#ffffff" stroke="none" />
    <!-- Inner Telemetry Wave -->
    <path d="M64 36 a 20 20 0 0 1 0 28" stroke-width="7" />
    <path d="M36 64 a 20 20 0 0 1 0 -28" stroke-width="7" />
    <!-- Outer Telemetry Wave -->
    <path d="M74 26 a 34 34 0 0 1 0 48" stroke-width="7" />
    <path d="M26 74 a 34 34 0 0 1 0 -48" stroke-width="7" />
  </g>
</svg>
